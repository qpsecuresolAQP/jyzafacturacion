services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jyzafacturacion_app
    restart: unless-stopped
    environment:
      DEBUG: "${DEBUG:-false}"
      SECURITY_SALT: "${SECURITY_SALT}"
      PERUAPI_KEY: "${PERUAPI_KEY}"
      PERUAPI_BASE_URL: "${PERUAPI_BASE_URL:-https://peruapi.com/api}"
      DATABASE_URL: "mysql://${DB_USERNAME}:${DB_PASSWORD}@db/${DB_NAME}?encoding=utf8mb4"
    ports:
      - "${APP_PORT:-8092}:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./webroot/xml:/var/www/html/webroot/xml
      - ./webroot/cdr:/var/www/html/webroot/cdr
      - app_logs:/var/www/html/logs
      - app_tmp:/var/www/html/tmp
    networks:
      - jyzafacturacion_net
      - main_npm_network
    healthcheck:
      test: ["CMD", "php", "-r", "exit(0)"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: mysql:8.0
    container_name: jyzafacturacion_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${DB_NAME}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - jyzafacturacion_db_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - jyzafacturacion_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  jyzafacturacion_net:
    driver: bridge
  main_npm_network:
    external: true

volumes:
  app_logs:
  app_tmp:
  jyzafacturacion_db_data:
